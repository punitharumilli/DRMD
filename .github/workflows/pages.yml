# Publishes the DRMD landing page on GitHub Pages.
# Every change to the page on the main branch is published automatically.

name: Publish on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - .github/workflows/pages.yml
  # Allows a manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publication at a time; a running publication is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Prepare the site
        run: |
          if [ ! -f index.html ] || [ ! -d assets ]; then
            echo "::error::index.html and the assets folder must be in the root of the repository."
            exit 1
          fi
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v5
