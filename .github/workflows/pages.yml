# Publishes the DRMD landing page on GitHub Pages.
# Every change to the page on the main branch is published automatically.

name: Publish on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - .github/workflows/pages.yml
  # Allows a manual run from the Actions tab
  workflow_dispatch:

# Each action is pinned to an exact, reviewed commit, so a changed tag upstream cannot change
# what runs here. The token can only read the repository and publish the page.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one publication at a time; a running publication is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the site
        run: |
          if [ ! -f index.html ] || [ ! -d assets ]; then
            echo "::error::index.html and the assets folder must be in the root of the repository."
            exit 1
          fi
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/

      - name: Set up GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
